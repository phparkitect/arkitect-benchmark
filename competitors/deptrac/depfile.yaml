# The cross-tool rule, expressed for deptrac. See ../akeneo/RULE.md.
#
# The Domain regex must cross namespace separators: components nest to different
# depths (Akeneo\Category\Domain but also Akeneo\Pim\Enrichment\Domain), so a
# single-segment pattern silently selects almost nothing.
deptrac:
  paths:
    - ../../akeneo/src

  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: '^Akeneo\\.*\\Domain\\.*'
    - name: Symfony
      collectors:
        - type: classLike
          value: '^Symfony\\.*'

  ruleset:
    # Domain may depend on nothing that is modelled here, i.e. not on Symfony
    Domain: ~
